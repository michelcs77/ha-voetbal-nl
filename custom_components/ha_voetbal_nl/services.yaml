    team_id:
      name: Team-ID
      required: true
      selector:
        text:
    wedstrijd_id:
      name: Wedstrijd-ID
      required: false
      selector:
        text:
    testmodus:
      name: Testmodus
      default: true
      selector:
        boolean:

verstuur_trainingsdagbericht:
  name: Trainingsdagbericht versturen
  description: Verstuur trainingsinfo met optioneel weer en actuele aanwezigheidsstand. Handmatige trainingkeuze is alleen in testmodus toegestaan.
