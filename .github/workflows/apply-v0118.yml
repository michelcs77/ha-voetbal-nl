name: Apply HA Voetbal.nl v0.11.8

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v0.11.8 patches
        shell: bash
        run: |
          set -euo pipefail
          for p in .github/v0118/*.diff; do
            git apply --check "$p"
            git apply "$p"
          done
          cp custom_components/ha_voetbal_nl/translations/en.json custom_components/ha_voetbal_nl/strings.json
          rm -rf custom_components/ha_voetbal_nl/__pycache__
          find custom_components/ha_voetbal_nl -type f -name '*.pyc' -delete
          python -m compileall -q custom_components/ha_voetbal_nl
          rm -rf custom_components/ha_voetbal_nl/__pycache__
          find custom_components/ha_voetbal_nl -type d -name '__pycache__' -prune -exec rm -rf {} +
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('custom_components/ha_voetbal_nl')
          assert json.loads((root/'manifest.json').read_text())['version'] == '0.11.8'
          for p in [root/'translations/en.json', root/'translations/nl.json', root/'strings.json', root/'icons.json']:
              json.loads(p.read_text())
          print('v0.11.8 validation OK')
          PY
          rm -rf .github/v0118 .github/workflows/apply-v0118.yml
      - name: Commit v0.11.8
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release v0.11.8 - visual WhatsApp message planning'
          git push
